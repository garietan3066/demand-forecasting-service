name: Tests and dependency audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-locked:
    name: Windows Python 3.11 locked environment
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update installation tools
        run: python -m pip install --upgrade pip setuptools

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements/development-windows-py311.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Audit dependencies
        run: python -m pip_audit

  linux-compatibility:
    name: Linux compatibility smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update installation tools
        run: python -m pip install --upgrade pip setuptools

      - name: Install dependencies
        run: python -m pip install -r requirements/development.in

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Audit dependencies
        run: python -m pip_audit