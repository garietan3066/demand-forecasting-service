[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "venv",
    ".venv-check",
    "data",
    "artifacts",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"